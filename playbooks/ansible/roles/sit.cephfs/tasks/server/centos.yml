---
# Note: ceph-common package is only required to be able to mount the ceph volume
#       from the host. Cephadm will download all other required container images
#       independently of the repository.
- name: Install required packages
  yum:
    name:
      - podman
      - lvm2
      - ceph-common
    state: present

- name: Download cephadm
  get_url:
    url: "https://2.chacra.ceph.com/r/ceph/wip-anoopcs9-cephfs-proxy-fscrypt-fsync/ad94b10d3fb42e8c87599cebf5d87aa390a31336/centos/9/flavors/default/noarch/cephadm"
    dest: /root/cephadm
    mode: 0755
